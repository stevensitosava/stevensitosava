<svg xmlns="http://www.w3.org/2000/svg" width="495" height="300" viewBox="0 0 495 300" role="img" aria-label="My cloud: 14/14 checks, 20 containers">
<style>
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6edf3}
.t{font-size:15px;font-weight:600}.m{fill:#8b949e;font-size:12px}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{to{opacity:1}}
@keyframes pulse{0%{opacity:.6;r:5}100%{opacity:0;r:14}}
</style>
<rect x=".5" y=".5" width="494" height="299" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="24" y="32" class="t">My cloud, live</text>
<circle cx="375" cy="27" r="5" fill="#3fb950"/><circle cx="375" cy="27" r="5" fill="#3fb950" style="animation:pulse 1.8s ease-out infinite"/><text x="471" y="32" text-anchor="end" class="m" style="fill:#3fb950">all systems ok</text>
<g class="in" style="animation-delay:0.15s"><text x="24" y="74" class="mono" font-size="26" font-weight="700" fill="#3fb950">14/14</text><text x="24" y="94" class="m">health checks passing</text></g><g class="in" style="animation-delay:0.27s"><text x="254" y="74" class="mono" font-size="26" font-weight="700" fill="#3fb950">20/20</text><text x="254" y="94" class="m">containers running</text></g><g class="in" style="animation-delay:0.39s"><text x="24" y="134" class="mono" font-size="26" font-weight="700" fill="#e6edf3">3 days</text><text x="24" y="154" class="m">up without a restart</text></g><g class="in" style="animation-delay:0.51s"><text x="254" y="134" class="mono" font-size="26" font-weight="700" fill="#e6edf3">7.6 W</text><text x="254" y="154" class="m">at the wall (estimate)</text></g><text x="24" y="196" class="m">Last runs of the scheduled jobs (Amsterdam time)</text><g class="in" style="animation-delay:0.7s"><circle cx="30" cy="210" r="3.5" fill="#3fb950"/><text x="42" y="214" class="m" style="fill:#e6edf3">Health metrics</text><text x="471" y="214" text-anchor="end" class="m">28 Nov, 09:57</text></g><g class="in" style="animation-delay:0.7999999999999999s"><circle cx="30" cy="226" r="3.5" fill="#3fb950"/><text x="42" y="230" class="m" style="fill:#e6edf3">Outside heartbeat</text><text x="471" y="230" text-anchor="end" class="m">28 Nov, 09:57</text></g><g class="in" style="animation-delay:0.8999999999999999s"><circle cx="30" cy="242" r="3.5" fill="#3fb950"/><text x="42" y="246" class="m" style="fill:#e6edf3">Encrypted backup</text><text x="471" y="246" text-anchor="end" class="m">28 Nov, 04:35</text></g><g class="in" style="animation-delay:1s"><circle cx="30" cy="258" r="3.5" fill="#3fb950"/><text x="42" y="262" class="m" style="fill:#e6edf3">Video queue check</text><text x="471" y="262" text-anchor="end" class="m">28 Nov, 09:00</text></g>
<text x="24" y="290" class="m">Last encrypted backup 28 Nov, 04:46 · drawn 28 Nov, 09:57</text>
</svg>