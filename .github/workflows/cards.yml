# Refreshes the README's live cards (cards/*.svg) from the public status of www.stevensawarin.com,
name: Live cards

on:
  schedule:
    - cron: "20 1,7,13,19 * * *"   # a few minutes after the server's own reads (02:00, 08:00, 14:00, 20:00 Amsterdam)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/cards.mjs", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw the cards
        run: node scripts/cards.mjs
      - name: Commit when they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || (git commit -m "Live cards: new numbers" && git push)

